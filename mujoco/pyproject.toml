[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agilex-piper-mujoco"
version = "0.1.0"
description = "AgileX PiPER simulation and reinforcement-learning environments for MuJoCo"
requires-python = ">=3.10"
dependencies = [
  "gymnasium==1.3.0",
  "mujoco==3.11.0",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
train = ["stable-baselines3==2.9.0"]
gr00t = ["msgpack>=1.0,<2", "msgpack-numpy>=0.4.8,<1", "pyzmq>=26,<28"]

[tool.setuptools.packages.find]
include = ["piper_mujoco*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
